name: CDK validate

on:
  pull_request:
    branches:
      - dev
      - tst
      - prod
  push:
    branches:
      - dev
      - tst
      - prod

permissions:
  contents: read

jobs:
  validate:
    name: CDK validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
